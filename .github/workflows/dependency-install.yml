# Bare CI: prove every locked Python project still installs, so dependency
# bumps (e.g. Dependabot) are known-good. Projects are discovered, not listed,
# so new ones are picked up without editing this file.
name: Dependency install

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      poetry: ${{ steps.find.outputs.poetry }}
      uv: ${{ steps.find.outputs.uv }}
    steps:
      - uses: actions/checkout@v4
      - id: find
        run: |
          # Poetry projects: pyproject.toml with a [tool.poetry] table.
          poetry=$(grep -rl --include=pyproject.toml '^\[tool\.poetry\]' . \
            | xargs -r -n1 dirname | sort | jq -R . | jq -sc .)
          # uv projects: a uv.lock sits beside the pyproject.toml.
          uv=$(find . -name uv.lock -not -path './.git/*' \
            | xargs -r -n1 dirname | sort | jq -R . | jq -sc .)
          echo "poetry=${poetry}" >> "$GITHUB_OUTPUT"
          echo "uv=${uv}" >> "$GITHUB_OUTPUT"

  poetry-install:
    needs: discover
    if: needs.discover.outputs.poetry != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.poetry) }}
    name: poetry install (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pipx install poetry
      - run: poetry install
        working-directory: ${{ matrix.project }}

  uv-sync:
    needs: discover
    if: needs.discover.outputs.uv != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.uv) }}
    name: uv sync --locked (${{ matrix.project }})
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --all-extras
        working-directory: ${{ matrix.project }}
